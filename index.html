<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Portfolio</title>

    
    <link rel="stylesheet" href="./CSS/base.css">
    <link rel="stylesheet" href="./CSS/variables.css">
    <link rel="stylesheet" href="./CSS/main.css">
    <script type="module" src="./js/main.js" defer></script>
</head>
<body>

    <div class="main-container">
        <div class="project-container">
            <div class="project-box">
                <div class="project-box-header">
                    <span class="project-box-name">project name</span>
                    <button class="project-box-exit">X</button>

                </div>
                <div class="project-box-vid-container">
                    <video class="project-box-vid"></video>
                </div>
                <div class="project-box-description"></div>
            </div>
        </div>
        <div class="main-header-container">
            <div class="logo-container">
                <img src="./assets/images/logo-transparent-png.png" alt="" class="logo">
            </div>
            <div class="search-container">
                <img src="./assets/icons/search.png" alt="" class="search-icon">
                <input type="text" class="search-input" placeholder="Search Project">
        
            </div>
            <div class="settings-container">
                <img src="./assets/icons/pfSettings.png" alt="" class="settings-icon">
            </div>

        </div>

        <div class="main-body-container">


            
          

        </div>
    </div>
    
</body>
</html>
